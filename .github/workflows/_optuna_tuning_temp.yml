name: ML Evolution — P1 Optuna Hyperparameter Tuning (TEMPORARY, read-only)

on:
  workflow_dispatch:

jobs:
  optuna-tuning:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install optuna

      - name: Run Optuna hyperparameter tuning (read-only against Supabase)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/_optuna_hyperparameter_tuning_temp.py
