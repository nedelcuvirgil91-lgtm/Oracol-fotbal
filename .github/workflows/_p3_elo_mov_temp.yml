name: ML Evolution — P3 Goal Difference ELO / MOV Replay (TEMPORARY, read-only)

on:
  workflow_dispatch:

jobs:
  elo-mov-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run P3 ELO MOV replay comparison (read-only against Supabase)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/_p3_elo_mov_replay_temp.py
