name: Football Oracle — Backfill Odds

on:
  # Rulare manuală cu parametri
  workflow_dispatch:
    inputs:
      league:
        description: "Ligă (trebuie să existe în LEAGUE_DIVISION_CODES)"
        required: true
        default: "Premier League"
        type: string
      dry_run:
        description: "Dry run (fără scriere în Supabase)"
        required: false
        default: "true"
        type: boolean

jobs:
  backfill-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run odds backfill
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          ARGS="--league \"${{ github.event.inputs.league }}\""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "Rulează: python sync/backfill_odds.py $ARGS"
          eval python sync/backfill_odds.py $ARGS
