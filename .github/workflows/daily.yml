name: Football Oracle — Daily Sync

on:
  schedule:
    # Rulează zilnic la 03:00 UTC
    - cron: "0 3 * * *"
  # Permite și rulare manuală din GitHub Actions UI
  workflow_dispatch:
    inputs:
      skip_features:
        description: "Sări actualizarea feature-urilor derivate (formă, H2H, cornere, cartonașe, faulturi)"
        required: false
        default: "false"
        type: boolean
      skip_ml:
        description: "Sări reantrenarea ML"
        required: false
        default: "false"
        type: boolean
      dry_run:
        description: "Dry run (fără scriere în Supabase)"
        required: false
        default: "false"
        type: boolean

jobs:
  daily-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # [ADAUGAT Sprint 1] Necesar pt. Match Statistics (FreeLF Event
          # Resolver + get_match_statistics) — descoperire colaterală: acest
          # secret lipsea din workflow și pentru fluxurile deja existente
          # care-l folosesc (Pasul 5, odds/get_matches_for_week) — gol
          # pre-existent, nu introdus aici, semnalat separat utilizatorului.
          RAPIDAPI_KEY_FREELIVEFOOTBALL: ${{ secrets.RAPIDAPI_KEY_FREELIVEFOOTBALL }}
          # [ADAUGAT Sprint 0 — Stabilizare] Cele 4 chei lipseau din acest
          # workflow (găsit prin audit: toate sync-urile Sprint 2 rulau
          # neautentificate în jobul nocturn — 401 pe oddsapi/freelivefootball,
          # confirmat live în provider_call_log). Fără excepție, orice
          # provider apelat de sync/run_daily.py trebuie să-și primească
          # cheia aici — pipeline-ul nu se poate autentifica prin cache sau
          # printr-un alt job.
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.skip_features }}" = "true" ]; then ARGS="$ARGS --no-features"; fi
          if [ "${{ github.event.inputs.skip_ml }}" = "true" ]; then ARGS="$ARGS --no-ml"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python sync/run_daily.py $ARGS

      - name: Upload sync logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-logs-${{ github.run_id }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore
