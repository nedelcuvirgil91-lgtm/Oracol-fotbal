name: Football Oracle — Flashscore Extra Leagues (extindere etapizată)

# [ADAUGAT 2026-08-10] Cerere explicită proprietar produs: extindere
# etapizată a competițiilor urmărite de Flashscore — 3 din 6 propuse, cele
# cu sezonul deja început (Jupiler Pro League/Belgia, Ekstraklasa/Polonia,
# Scottish Premiership/Scoția). Verificate Nivel B (WebSearch, URL exact
# confirmat, nu ghicit) — vezi providers/flashscore/discovery.py,
# FLASHSCORE_TRACKED_COMPETITIONS.
#
# Workflow SEPARAT, nu adăugat la night_sync.yml — cerere explicită: dacă
# ligile noi ar îngreuna procesul de noapte, să ruleze independent, la altă
# oră. Mirror exact al etapei Flashscore din sync/run_night.py
# (_stage_flashscore — leagues=None -> acum listă explicită, ca setul de
# bază să NU includă implicit ligile noi), dar scopat DOAR la cele 3 ligi
# noi, la o oră de zi diferită.
#
# Cadență: 10:00 UTC (13:00 ora României, EEST) — ales cu marjă explicită,
# nu "ora 11-12" cerută literal, pentru că acel interval e deja ocupat:
# sync_pre_match_odds.yml rulează la 08:00 UTC (timeout 45 min -> 08:45 cel
# mai târziu), live_sync.yml la 09:00 UTC (timeout 50 min -> 09:50 cel mai
# târziu). 10:00 UTC lasă 10 min marjă după live_sync și e cu mult înainte
# de următoarea rulare live_sync (13:00 UTC) — fără niciun mecanism de
# concurrency între workflow-uri diferite (același principiu ca la
# live_sync.yml: programare simplă, nu blocare).
#
# Prima rulare (catch-up istoric pentru cele 3 ligi) poate dura mult mai
# mult decât rulările ulterioare — Delta Sync (is_flashscore_match_already_
# collected) face rulările următoare ieftine, sar meciurile deja colectate.
#
# ── [EXTINS 2026-10-17] 3 → 6 ligi: + Austria, Elveția, Danemarca ──────────
#
# Cele 3 ligi rămase din cele 6 propuse pe 2026-08-10, cerute explicit de
# proprietarul produsului. Slug-uri verificate NIVEL A (navigare live,
# 2026-10-15) — mai tare decât Nivelul B cu care au intrat primele 3.
#
# DE CE AICI, și nu în `night_sync`: `sync/run_night.py` are o listă
# explicită (`_NIGHT_SYNC_LEAGUES`) cu nota „dacă se adaugă o ligă nouă la
# setul de bază, lista trebuie extinsă manual, deliberat — nu implicit".
# Night Sync are cel mai strâns buget de timp din proiect (anulat la 180 min
# pe 16 oct, incidentul TheSportsDB). Lista lui rămâne NEATINSĂ, impus de o
# gardă de test.
#
# DE CE catch-up-ul NU e lăsat pe `live_sync`, deși acela le-ar prinde
# oricum: `run_live` cheamă `run_flashscore(leagues=None)`, adică TOATE
# competițiile urmărite de Flashscore — deci cele 3 ligi noi intră automat
# acolo, zilnic, fără să fie nevoie de vreo modificare. Dar `live_sync` are
# `timeout-minutes: 50` și a fost deja tăiat de două ori (27 și 29 august).
# Prima trecere, cea scumpă, se face aici, unde bugetul e 90 min.
#
# TIMEOUT-UL RĂMÂNE 90, NEATINS — decizie pe cifre măsurate, nu pe precauție:
# ultimele 6 rulări programate au durat 1m51s … 1m59s fiecare (regim stabil,
# Delta Sync sare tot). Catch-up-ul pentru 3 ligi noi, la plafonul de 50 de
# meciuri/ligă și politețea de 2-4 s între cereri reale, iese ~12-15 min.
# Marjă de peste 6×. Dacă totuși se lovește plafonul, ăsta e un semnal real,
# nu unul mascat de o marjă mărită preventiv — aceeași disciplină ca la
# `live_sync` (50 neatins) și `sync_pre_match_odds` (45 neatins până la
# măsurătoare).

on:
  schedule:
    # [DECALAJ PREVENTIV — 2026-08-30, decizie explicită proprietar produs]
    # 0 10 -> 30 10 — coincidea la minut cu flashscore_extra_leagues (acest
    # workflow) și validation_analysis. Nu repară un defect: verificat
    # deja (CLAUDE.md) că live_sync.yml rulează cu toate cele 17 ligi
    # urmărite (le include implicit pe cele 3 de-aici), și cele două
    # coliziuni observate empiric n-au produs niciun dublu pe cheia
    # naturală, protejate de pg_advisory_xact_lock + constrângeri UNIQUE.
    # Motiv pur preventiv, aceeași disciplină „fără suprapunere prin
    # programare" folosită peste tot în proiect.
    - cron: "30 10 * * *"
  workflow_dispatch: {}

concurrency:
  group: flashscore-extra-leagues
  cancel-in-progress: false

jobs:
  flashscore-extra-leagues:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run Flashscore — Extra Leagues (BE/PL/SCO + AT/CH/DK)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python -c "
          from providers.flashscore.discovery import get_limit_per_league_automated
          from providers.flashscore.run_foundation_data_layer import run as run_flashscore
          exit_code = run_flashscore(
              leagues=['Jupiler Pro League', 'Ekstraklasa', 'Scottish Premiership',
                       'Austria Bundesliga', 'Swiss Super League', 'Danish Superliga'],
              limit_per_league=get_limit_per_league_automated(),
              dry_run=False,
              include_future_fixtures=False,
          )
          raise SystemExit(exit_code)
          "
