name: Football Oracle — Flashscore Weekly Fixtures Discovery

# [ADAUGAT 2026-08-05, cerere explicita proprietar produs] Singurul workflow
# AUTOMAT care descopera meciuri VIITOARE prin Flashscore. night_sync.yml si
# live_sync.yml apeleaza amandoua run_foundation_data_layer.run() cu
# include_future_fixtures=False (ADR-045, motiv: fara valoare pt.
# statistici/H2H/lineups pe un meci nejucat) - dar asta lasa neacoperita
# simpla EXISTENTA a meciului (identitate: echipe/liga/data), diferita de
# imbogatirea lui cu statistici. Gaura a fost demonstrata live (audit
# 2026-08-05): Eredivisie/Primeira Liga aveau 0 meciuri gasite de providerii
# API pt. saptamana urmatoare, 9-10 gasite de Flashscore. Acest workflow
# umple exact acea gaura, fara sa atinga night_sync.yml/live_sync.yml
# (raman neschimbate, cum a cerut proprietarul produsului).
#
# Refoloseste 100% codul existent, testat (providers/flashscore/
# run_foundation_data_layer.py, discover_matches() + run_foundation_data_
# layer_for_discovered_matches(), Delta Sync inclus) - niciun script nou,
# niciun mecanism nou de fetch/persist (Single Owner, ADR-045). Tab-urile
# stats/lineups/player_stats/h2h/standings vor fi goale pt. un meci
# nejucat - normalizat deja corect (Data Completeness Score), nu un caz
# nou de tratat.
#
# [FIX 2026-08-05, gasit in timpul implementarii] --future-fixtures-only
# (nu doar include_future_fixtures implicit) - fara el, discover_matches()
# incearca /results/ INTAI si verifica /fixtures/ DOAR daca /results/ e
# gol (comportament CLI/manual, neschimbat pt. restul apelantilor). Pt.
# orice liga activa, /results/ are aproape mereu continut (night_sync.yml/
# live_sync.yml il acopera deja acolo) - deci /fixtures/ nu ar fi fost
# aproape niciodata verificat, anuland scopul acestui workflow. --future-
# fixtures-only cere /fixtures/ necondiționat - vezi discovery.py
# (_discover_for_hub, future_fixtures_only) pentru detaliu complet.
#
# [FIX 2026-08-05, complementar] database.queries.is_flashscore_match_
# already_collected() a fost corectat sa nu mai sara la nesfarsit un meci
# "schelet" (scris aici, fara scor inca) - verifica acum si actual_result/
# kickoff_date, nu doar existenta randului. Fara acel fix, night_sync.yml/
# live_sync.yml (care descopera acelasi meci mai tarziu, prin /results/,
# dupa ce s-a jucat) l-ar fi sarit definitiv prin Delta Sync, lasand
# scorul NULL permanent.
#
# Cadenta: [EXTINS 2026-08-06, cerere explicita proprietar produs — motiv:
# get_matches_for_week() a devenit Database-First (ADR-053), deci o gaura
# de prospetime in match_history nu mai e mascata de un fallback live
# automat pt. fiecare utilizator - conteaza mult mai mult acum sa fie
# mica] DE 2 ORI/saptamana - luni SI joi, 00:00 UTC (03:00 Romania, EEST) -
# fereastra maxima de invechire scade de la 7 zile la ~3-4 zile. Fiecare
# rulare acopera saptamana intreaga dintr-o singura trecere (Delta Sync
# face reluarile ieftine, doar meciurile noi de la ultima rulare sunt
# fetch-uite complet). [ZIUA JOI ADAUGATA 2026-08-05, cerere explicita
# proprietar produs — "sa nu mai stam pana luni"] Ramane si azi, alaturi
# de luni (ziua originala) — ora ramane neschimbata (00:00 UTC, deja
# verificata fara suprapuneri). Inainte de night_sync.yml (03:00 UTC) SI
# de live_sync.yml (09:00/13:00/17:00 UTC), gap garantat de
# timeout-minutes (aceeasi disciplina de "fara suprapunere prin
# programare, nu prin lock" ca restul workflow-urilor Flashscore - vezi
# live_sync.yml). [ACTUALIZAT 2026-08-06, timeout marit 90->120 min,
# vezi comentariul de la timeout-minutes mai jos] gap minim ~1h fata de
# night_sync.yml, ~7h fata de live_sync.yml, in cel mai rau caz (rulare
# care consuma tot plafonul). O sesiune Playwright Flashscore per
# fereastra orara, niciodata doua simultan.
#
# limit-per-league: 25 - dimensiunea reala a hub-ului /fixtures/ (16-28
# meciuri unice, verificat live, fara paginare dincolo de randarea
# initiala - vezi discovery.py) acopera confortabil o saptamana intreaga
# per competitie fara sa ceara mai mult decat hub-ul poate intoarce.
#
# timeout-minutes: 120 — [MARIT de la 90, 2026-08-06, cerere explicita
# proprietar produs] confirmat live: prima rulare reala (run #1,
# workflow_dispatch, 22:09-23:39 UTC) a atins plafonul de 90 min si a
# fost oprita de GitHub Actions (conclusion=cancelled, nu esec) inainte
# sa termine toate cele 14 ligi — a acoperit 8 (Romania SuperLiga,
# Champions League, Premier League, La Liga, Serie A, Bundesliga,
# Ligue 1, Europa League, MLS, Primeira Liga - ultima intrerupta la
# mijloc), a ramas fara Eredivisie/Super Lig/HNL/Conference League
# (ultimele 4 din FLASHSCORE_TRACKED_COMPETITIONS, niciodata atinse).
# Ritm real observat: ~8 ligi / 89 min => ~11 min/liga; 120 min
# acopera confortabil restul de gol ramas (Delta Sync sare deja ce s-a
# scris azi), desi tot nu garanteaza o rulare COMPLETA din zero pentru
# toate cele 14 (ar cere ~140+ min) — acceptat, acelasi tipar sigur,
# nu distructiv (fiecare meci se persista atomic, secvential; o oprire
# la mijloc nu corupe nimic, doar lasa restul pt. rularile urmatoare,
# exact ca la live_sync.yml, rularile #15/#16). Marja fata de
# live_sync.yml (prima rulare a zilei, 09:00 UTC) ramane ampla: acest
# workflow porneste la 00:00 UTC, deci chiar folosind toate cele 120
# min s-ar termina cel tarziu 02:00 UTC, la 7 ore inainte.

on:
  schedule:
    - cron: "0 0 * * 1"
    - cron: "0 0 * * 4"
  workflow_dispatch:
    inputs:
      leagues:
        description: "Competiții (separate prin virgulă; gol = toate din FLASHSCORE_TRACKED_COMPETITIONS)"
        required: false
        default: ""
      limit_per_league:
        description: "Limită meciuri descoperite per competiție"
        required: false
        default: "25"
      dry_run:
        description: "Doar Discovery — fără fetch/persist"
        required: false
        default: "false"
        type: boolean

jobs:
  flashscore-weekly-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run Flashscore Weekly Fixtures Discovery
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then DRY_RUN_FLAG="--dry-run"; fi

          LEAGUES_ARG=()
          if [ -n "${{ github.event.inputs.leagues }}" ]; then
            IFS=',' read -ra LEAGUES_ARG <<< "${{ github.event.inputs.leagues }}"
          fi

          # --future-fixtures-only: cere /fixtures/ necondiționat (vezi
          # comentariul din capul fișierului) - spre deosebire de
          # night_sync.yml/live_sync.yml, care nu trec deloc acest flag.
          if [ ${#LEAGUES_ARG[@]} -gt 0 ]; then
            python -m providers.flashscore.run_foundation_data_layer \
              --leagues "${LEAGUES_ARG[@]}" \
              --limit-per-league "${{ github.event.inputs.limit_per_league || '25' }}" \
              --future-fixtures-only \
              $DRY_RUN_FLAG
          else
            python -m providers.flashscore.run_foundation_data_layer \
              --limit-per-league "${{ github.event.inputs.limit_per_league || '25' }}" \
              --future-fixtures-only \
              $DRY_RUN_FLAG
          fi
