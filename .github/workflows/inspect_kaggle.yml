name: Football Oracle — Inspect Kaggle Datasets

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Show installed versions
        run: |
          echo "Python: $(python --version)"
          echo "----"
          pip show pandas | grep -E "Name|Version"
          echo "----"
          pip show kagglehub | grep -E "Name|Version"

      - name: Inspect Kaggle datasets
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
        run: python -m sync.sources.kaggle --inspect
