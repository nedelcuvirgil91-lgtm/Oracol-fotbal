name: Football Oracle — Lineup Sync (Free Live Football)

# [ADAUGAT Sprint 3, R-Sync-10] Cadență DEDICATĂ, separată de daily.yml —
# aliniamentele FreeLF se confirmă aproape de kickoff, nu o dată/zi e prea
# rar. Script-ul interoghează doar fixture-urile din fereastra apropiată de
# kickoff (scheduled_fixtures.freelf_event_id, R-Sync-7a) — o rulare fără
# fixture-uri în fereastră termină instant, fără cost. Vezi
# sync/sync_lineup_freelf.py pentru detalii arhitecturale complete și
# motivul ferestrei generoase (T-15min..T+240min).
#
# [REDUS — Pasul 2 Master Repair Plan] De la */15 la */30 min — cota FreeLF
# e documentat cronic epuizată (CLAUDE.md), iar acest job (fără detectare
# de schimbare a lotului între poll-uri, gol cunoscut, neatins aici — vezi
# Master Repair Plan P0-04) era cel mai concret contribuitor, până la 32
# apeluri FreeLF/meci în fereastra de 4h. La */30 min, un meci în fereastra
# de 4h primește ~8 poll-uri (până la 16 apeluri), înjumătățind consumul,
# păstrând acoperire rezonabilă aproape de kickoff.
#
# [REDUS temporar 2026-08-10 -> REVENIT la fel de 2026-08-10] Redus scurt
# la 1x/zi (buget GitHub Actions aproape epuizat, 1800/2000 min în 10
# zile) — ar fi lăsat un gol real de acoperire (fereastra e relativă la
# MOMENTUL rulării, T-15min..T+240min, neschimbată în sync/sync_lineup_
# freelf.py, deci 1x/zi ar fi acoperit STRICT meciurile dintr-un interval
# de ~4h15, restul zilei rămânând fără aliniamente deloc — acceptat
# explicit la momentul respectiv, dar redundant acum). Motivul reducerii
# a dispărut: repo-ul a devenit public (2026-08-10) — pe repo public,
# GitHub Actions e gratuit, fără plafon de minute. Revenit la */30 min,
# acoperire completă pe toată ziua restaurată.
#
# ── [REDUS 2026-08-29, */30 -> 3 rulari/zi] ──────────────────────────────
# Decizie explicita proprietar produs, dupa un audit al scheduler-ului.
# DOUA motive independente, ambele MASURATE, nu presupuse:
#
# 1. Workflow-ul nu produce NIMIC. `provider_call_log`, 19-29 august:
#    122 apeluri `freelivefootball`, din care 0 (ZERO) reusite — 89
#    `other_error`, 33 `quota`. Ambele tabele-tinta sunt goale:
#    `freelf_lineup_snapshot` = 0 randuri, `upcoming_lineups` = 0 randuri.
#    Cota FreeLF cronic epuizata era deja documentata in CLAUDE.md; ce NU
#    era documentat e ca rezultatul e zero absolut, de cel putin 10 zile.
#    NU se opreste complet (decizie explicita) — ramane viu, ca sa reia
#    acoperirea automat daca/cand cota FreeLF se reface.
#
# 2. Consuma 81% din toata incarcarea programata a repo-ului (48 din ~59
#    rulari declarate/zi) intr-un moment in care scheduler-ul GitHub
#    livreaza doar ~8-11 rulari/zi pe tot repo-ul (throttle activ din 27
#    august, corelat cu incidentul GitHub Actions din 26 august). ATENTIE
#    la interpretare: cronologia arata ca volumul nostru NU a cauzat
#    degradarea — `*/30` era in vigoare din 10 august, iar 26 august a fost
#    normal (44 min intarziere mediana). Reducerea e un EXPERIMENT de
#    eliberare a alocatiei, cu cost zero fiindca oricum nu producea nimic;
#    nu o reparatie dovedita.
#
# ORELE (ora Romaniei, EEST=UTC+3 vara): 17:00, 20:00, 21:30.
# Alese pe distributia REALA a loviturilor de start (311 meciuri, 14 zile):
# cu fereastra T-15min..T+240min acopera 17:45->01:30 ora Romaniei = 232
# din 311 meciuri (75%). Prima rulare e la 17:00, nu 18:00, tocmai fiindca
# ora 17:00 concentreaza 38 de meciuri — a doua cea mai incarcata a zilei,
# altfel ratata la 15 minute distanta. Ramane neacoperit intervalul de
# noapte (02:00-05:00 ora Romaniei, ~42 de meciuri, tipic MLS).
#
# ⚠️ ORA DE IARNA: cron-ul GitHub e mereu UTC, fara DST. La trecerea la
# EET (UTC+2, ultima duminica din octombrie) aceste sloturi vor cadea la
# 16:00/19:00/20:30 ora Romaniei — cu o ora mai devreme decat intentionat.
# De reevaluat atunci, deliberat.
#
# [DECALAJ PREVENTIV — decizie proprietar produs] Slotul de mijloc e la
# `10 17`, nu `0 17`, ca sa NU coincida la minut cu slotul de 17:00 UTC al
# `live_sync.yml` (20:10 in loc de 20:00 ora Romaniei).
#
# Nu repara un defect: verificat ca cele doua NU se blocheaza reciproc
# (workflow-uri diferite ruleaza in paralel, pe runnere separate, fara lock)
# si NU se calca pe date (provideri diferiti — FreeLF vs. Flashscore; tabele
# diferite — `freelf_lineup_snapshot` vs. `flashscore_*`/`match_history`).
# Repo-ul are deja suprapuneri tolerate (live_sync+consensus la 09:00,
# extra_leagues+validation_analysis la 10:00).
#
# Motivul e preventiv, in doua puncte: (1) disciplina scrisa a proiectului
# ("fara suprapunere prin programare, nu prin lock" — vezi night_sync.yml si
# flashscore_weekly_fixtures.yml); (2) sub throttle-ul activ, doua workflow-uri
# declarate la EXACT acelasi minut ar putea concura pentru acelasi slot de
# livrare din coada — SPECULATIE, nu ceva masurat, dar costul evitarii e zero.
#
# Nota conexa, documentata public: minutul :00 al fiecarei ore e un moment de
# incarcare maxima pentru scheduler-ul GitHub (acolo se aglomereaza cron-urile
# scrise naiv), deci un decalaj de cateva minute e util si independent de
# coliziunea cu live_sync. Celelalte doua sloturi de aici raman la `0 14` si
# `30 18` — de reevaluat impreuna, daca observarea arata ca merita.

on:
  schedule:
    - cron: "0 14 * * *"
    - cron: "10 17 * * *"
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      window_minutes:
        description: "Fereastră (minute) înainte de kickoff pentru care se sincronizează"
        required: false
        default: "240"

jobs:
  lineup-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync.sync_lineup_freelf
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RAPIDAPI_KEY_FREELIVEFOOTBALL: ${{ secrets.RAPIDAPI_KEY_FREELIVEFOOTBALL }}
        run: |
          python -m sync.sync_lineup_freelf --window-minutes "${{ github.event.inputs.window_minutes || '240' }}"
