name: Football Oracle — Lineup Sync (Free Live Football)

# [ADAUGAT Sprint 3, R-Sync-10] Cadență DEDICATĂ, separată de daily.yml —
# aliniamentele FreeLF se confirmă aproape de kickoff, nu o dată/zi e prea
# rar. Script-ul interoghează doar fixture-urile din fereastra apropiată de
# kickoff (scheduled_fixtures.freelf_event_id, R-Sync-7a) — o rulare fără
# fixture-uri în fereastră termină instant, fără cost. Vezi
# sync/sync_lineup_freelf.py pentru detalii arhitecturale complete și
# motivul ferestrei generoase (T-15min..T+240min).
#
# [REDUS — Pasul 2 Master Repair Plan] De la */15 la */30 min — cota FreeLF
# e documentat cronic epuizată (CLAUDE.md), iar acest job (fără detectare
# de schimbare a lotului între poll-uri, gol cunoscut, neatins aici — vezi
# Master Repair Plan P0-04) era cel mai concret contribuitor, până la 32
# apeluri FreeLF/meci în fereastra de 4h. La */30 min, un meci în fereastra
# de 4h primește ~8 poll-uri (până la 16 apeluri), înjumătățind consumul,
# păstrând acoperire rezonabilă aproape de kickoff.
#
# [REDUS din nou — 2026-08-10, cerere explicită proprietar produs, buget
# GitHub Actions 90% consumat (1800/2000 min) după doar 10 zile din ciclul
# de facturare] 1x/zi, 17:00 UTC (20:00 ora României, EEST, UTC+3).
# **GOL DE ACOPERIRE ACCEPTAT EXPLICIT** (întrebare pusă, răspuns explicit
# al proprietarului produsului: "1x/zi oricum, accept golul") — fereastra
# rămâne relativă la MOMENTUL rulării (T-15min..T+240min, neschimbată în
# sync/sync_lineup_freelf.py), deci la o singură rulare/zi acoperă STRICT
# meciurile cu kickoff în 19:45–00:00 ora României. Orice meci din afara
# acestui interval NU mai primește aliniamente deloc (nu doar mai rar) —
# spre deosebire de live_sync.yml (Delta Sync complet, sigur de redus la
# 1x/zi fără gol de acoperire), acesta e un compromis funcțional real,
# asumat conștient pentru bugetul de minute, nu doar o optimizare de cost.

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      window_minutes:
        description: "Fereastră (minute) înainte de kickoff pentru care se sincronizează"
        required: false
        default: "240"

jobs:
  lineup-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync.sync_lineup_freelf
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RAPIDAPI_KEY_FREELIVEFOOTBALL: ${{ secrets.RAPIDAPI_KEY_FREELIVEFOOTBALL }}
        run: |
          python -m sync.sync_lineup_freelf --window-minutes "${{ github.event.inputs.window_minutes || '240' }}"
