name: Football Oracle — Live Sync

# [REDEFINIT — Pasul 2 Master Repair Plan, ADR-045 Single Owner] Nivelul
# USOR de sincronizare (sync/run_live.py) - DOAR Flashscore Foundation
# Data Layer (Delta Sync). Apelul catre providerii API
# (sync.run_daily.run()) a fost ELIMINAT - night_sync.yml Stage 1 apeleaza
# deja run_daily.run() COMPLET, o data pe zi; un apel suplimentar de aici
# ar fi exact tipul de "interogare inutila catre provideri live" interzis
# explicit de filosofia proiectului (cota API critica).
#
# Cadenta: [REDUS 2026-08-05, cerere explicita proprietar produs — 6
# rulari/zi insemnau 6 sesiuni Playwright separate catre Flashscore/zi,
# expunere inutila cand prospetimea de cateva ore nu e critica] 3x/zi -
# 09:00/13:00/17:00 UTC (12:00/16:00/20:00 ora Romaniei, EEST, UTC+3 -
# orele cerute explicit de proprietarul produsului). Program ales exclusiv
# prin cron, ca sa garanteze absenta suprapunerii cu night_sync.yml (03:00
# UTC, timeout-minutes: 120 -> GitHub Actions OPRESTE jobul la exact 120
# min, deci ora cea mai tarzie posibila de finalizare e 05:00 UTC, nu o
# estimare) SI cu sync_pre_match_odds.yml (08:00/20:00 UTC, timeout 45 min
# -> 08:45/20:45 cel mai tarziu) - fara niciun mecanism de concurrency
# intre workflow-uri diferite (prefera programare simpla, nu blocare).
# Slotul 09:00 are 15 min marja dupa 08:45 (sync_pre_match_odds); slotul
# 17:00 are peste 2h marja inainte de 20:00 (sync_pre_match_odds).
# Flashscore are Delta Sync real (is_flashscore_match_already_collected) -
# o cadenta mai deasa e ieftina prin design, spre deosebire de providerii
# API, care nu au acest mecanism si raman la o singura rulare/zi
# (night_sync.yml). `concurrency` de mai jos previne doar suprapunerea
# unei rulari live_sync cu EA INSASI (o rulare care depaseste 4h nu
# porneste una noua peste ea) - nu are legatura cu garantia fata de
# night_sync.yml/sync_pre_match_odds.yml, asigurata integral prin
# programare.
#
# [FIX 2026-08-05 — timeout 20min -> 50min] Rularile #15 si #16 au fost
# ambele CANCELLED de GitHub Actions la exact 20 min (log verificat, nu
# presupus: 18 meciuri procesate complet in ~17 min utile, ~57s/meci in
# medie, dominat de scraping Playwright per meci — nu un hang, treaba utila
# intrerupta la mijloc). Discovery a gasit 82 de meciuri neprocesate intr-o
# singura rulare, fata de un buget de ~20 meciuri/20min. Cauza directa:
# extinderea la 13 competitii urmarite (Primeira Liga/Eredivisie/Super
# Lig/HNL adaugate 2026-08-04) a marit backlog-ul de Delta Sync fara ca
# timeout-ul, calibrat cand erau mai putine competitii, sa fie recalibrat
# odata cu el. 50 min lasa un buget de ~50 meciuri/rulare (suficient sa
# consume backlog-ul in 2 rulari, nu nelimitat) si respecta in continuare
# marja fata de night_sync.yml/sync_pre_match_odds.yml — vezi comentariul
# despre cadenta, mai sus, pentru marjele exacte pe noile sloturi
# 09:00/13:00/17:00 UTC.

on:
  schedule:
    - cron: "0 9,13,17 * * *"
  workflow_dispatch: {}

concurrency:
  group: live-sync
  cancel-in-progress: false

jobs:
  live-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run Live Sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m sync.run_live
