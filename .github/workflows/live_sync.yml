name: Football Oracle — Live Sync

# [REDEFINIT — Pasul 2 Master Repair Plan, ADR-045 Single Owner] Nivelul
# USOR de sincronizare (sync/run_live.py) - DOAR Flashscore Foundation
# Data Layer (Delta Sync). Apelul catre providerii API
# (sync.run_daily.run()) a fost ELIMINAT - night_sync.yml Stage 1 apeleaza
# deja run_daily.run() COMPLET, o data pe zi; un apel suplimentar de aici
# ar fi exact tipul de "interogare inutila catre provideri live" interzis
# explicit de filosofia proiectului (cota API critica).
#
# Cadenta: [REDUS din nou — 2026-08-10, cerere explicita proprietar produs,
# buget GitHub Actions 90% consumat (1800/2000 min) dupa doar 10 zile din
# ciclul de facturare — night_sync (~70min/zi) + live_sync 3x/zi (~19min
# fiecare, ~57min/zi) + lineup_sync */30min (~20min/zi) erau principalii
# consumatori] 1x/zi, 17:00 UTC (20:00 ora Romaniei, EEST, UTC+3 — acelasi
# slot cu lineup_sync.yml, cerut explicit). Functional SIGUR de redus la
# 1x/zi (spre deosebire de lineup_sync) - Delta Sync-ul e complet
# (is_flashscore_match_already_collected scaneaza TOATE meciurile, nu doar
# o fereastra din jurul orei de rulare) - prospetimea scade la ~24h in loc
# de ~4-8h, dar niciun meci nu ramane definitiv neacoperit. Backlog-ul intre
# rulari creste ~3x (24h in loc de ~8h) - timeout-minutes crescut la 90 mai
# jos (de la 50), ca o rulare cu backlog mai mare sa nu fie intrerupta la
# mijloc (vezi precedentul #15/#16, comentariul de mai jos).
#
# [FIX 2026-08-05 — timeout 20min -> 50min] Rularile #15 si #16 au fost
# ambele CANCELLED de GitHub Actions la exact 20 min (log verificat, nu
# presupus: 18 meciuri procesate complet in ~17 min utile, ~57s/meci in
# medie, dominat de scraping Playwright per meci — nu un hang, treaba utila
# intrerupta la mijloc). Discovery a gasit 82 de meciuri neprocesate intr-o
# singura rulare, fata de un buget de ~20 meciuri/20min. Cauza directa:
# extinderea la 13 competitii urmarite (Primeira Liga/Eredivisie/Super
# Lig/HNL adaugate 2026-08-04) a marit backlog-ul de Delta Sync fara ca
# timeout-ul, calibrat cand erau mai putine competitii, sa fie recalibrat
# odata cu el (istoric — de atunci, cadenta a scazut la 1x/zi, 17:00 UTC,
# vezi comentariul despre cadenta, mai sus; timeout-ul a crescut la 90 min
# pentru acelasi motiv, backlog mai mare per rulare).

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch: {}

concurrency:
  group: live-sync
  cancel-in-progress: false

jobs:
  live-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run Live Sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m sync.run_live
