name: Football Oracle — Live Sync

# Nivelul USOR de sincronizare (sync/run_live.py) - discovery/scoruri/
# cote/statistici/lineups/player stats/H2H/standings, FARA Team DNA/
# Oracle Data Layer/Feature Engineering (acelea raman in Night Sync).
#
# Cadenta: la fiecare 2 ore (12 rulari/zi) - mai frecvent decat
# night_sync.yml (o data/noapte), dar semnificativ mai rar decat
# lineup_sync.yml (*/30 min), care sincronizeaza DOAR loturile - un singur
# apel usor. Live Sync apeleaza sync.run_daily.run() (multipli provideri
# API) + Flashscore FDL (Playwright) la fiecare rulare -> o cadenta prea
# agresiva ar consuma inutil cota API (Regulile pentru chei API,
# CLAUDE.md - tratate ca infrastructura critica). Delta Sync
# (is_flashscore_match_already_collected) limiteaza costul Flashscore la
# meciuri noi/incomplete, dar provider-ii API tot se re-interogheaza la
# fiecare rulare - 2h e un compromis rezonabil, ajustabil ulterior daca
# se dovedeste prea agresiv/prea rar.
# `concurrency` previne suprapunerea (o rulare care depaseste 2h nu
# porneste una noua peste ea).

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

concurrency:
  group: live-sync
  cancel-in-progress: false

jobs:
  live-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run Live Sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RAPIDAPI_KEY_FREELIVEFOOTBALL: ${{ secrets.RAPIDAPI_KEY_FREELIVEFOOTBALL }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m sync.run_live
