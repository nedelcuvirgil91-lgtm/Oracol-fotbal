name: Football Oracle — Night Sync (Faza 2)

# Orchestrare completa: Discovery -> Provideri API -> Flashscore ->
# Validation -> Canonical Database -> Team DNA -> Feature Engineering ->
# Oracle Refresh -> ML Refresh -> Diagnostics -> Cleanup -> Backup ->
# Raport Final (sync/run_night.py) — vezi acel fisier pentru detaliul
# fiecarei etape (unele ruleaza live, nu batch; Backup e neimplementat,
# ADR-044 Addendum A6, decizie explicita).
#
# [Faza 2 — consolidare, aprobare explicita proprietar produs, "Nu vreau
# joburi automate care executa aceleasi functii in paralel"] Acesta e
# ACUM singurul workflow AUTOMAT nocturn - daily.yml,
# flashscore_foundation_data_layer.yml si continuous_learning.yml au
# ramas doar workflow_dispatch (rulare manuala/depanare), cron-ul lor a
# fost eliminat explicit ca sa nu se ruleze de doua ori aceeasi noapte
# aceiasi provideri/Flashscore/Continuous Learning.

on:
  schedule:
    # Preia slotul original al daily.yml - prima etapa a Night Sync e
    # exact sync/run_daily.py.
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

jobs:
  night-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run Night Sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RAPIDAPI_KEY_FREELIVEFOOTBALL: ${{ secrets.RAPIDAPI_KEY_FREELIVEFOOTBALL }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m sync.run_night

      - name: Upload sync logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: night-sync-logs-${{ github.run_id }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Foundation Data Layer backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flashscore-backup-${{ github.run_id }}
          path: backups/
          retention-days: 30
          if-no-files-found: ignore
