name: Football Oracle — Night Sync (Faza 2)

# Orchestrare completa: Discovery -> Provideri API -> Flashscore ->
# Validation -> Canonical Database -> Team DNA -> Feature Engineering ->
# Oracle Refresh -> ML Refresh -> Diagnostics -> Cleanup -> Backup ->
# Raport Final (sync/run_night.py) — vezi acel fisier pentru detaliul
# fiecarei etape (unele ruleaza live, nu batch; Backup e neimplementat,
# ADR-044 Addendum A6, decizie explicita).
#
# [Faza 2 — consolidare, aprobare explicita proprietar produs, "Nu vreau
# joburi automate care executa aceleasi functii in paralel"] Acesta e
# ACUM singurul workflow AUTOMAT care ruleaza providerii API (Discovery,
# rezultate, statistici, sincronizare istoric, feature engineering, ML
# retrain, odds persistence) - daily.yml, flashscore_foundation_data_
# layer.yml si continuous_learning.yml au ramas doar workflow_dispatch
# (rulare manuala/depanare), cron-ul lor a fost eliminat explicit ca sa
# nu se ruleze de doua ori aceiasi provideri/Flashscore/Continuous
# Learning. `live_sync.yml` NU mai apeleaza providerii API (Pasul 2,
# Master Repair Plan, ADR-045 Single Owner) - doar Flashscore, la o
# cadenta separata.
#
# [CORECTAT Pasul 2 Master Repair Plan, 2026-08-03] Cron-ul a fost
# `0 3 * * 1` (doar luni) intre 2026-07-30 si 2026-08-03, editat direct pe
# GitHub, fara aprobare, degradand toata infrastructura de sincronizare de
# la zilnic la saptamanal (gasit prin audit complet). Revenit la zilnic,
# forma originala din Faza 2.

on:
  schedule:
    # [MODIFICAT — 2026-08-28, cerere explicita proprietar produs] Mutat cu o
    # ora mai devreme, 03:00 -> 02:00 UTC. timeout-minutes: 180 mai jos -> ora
    # cea mai tarzie posibila de finalizare devine 05:00 UTC (era 06:00).
    # Verificat direct (nu presupus) ca noua fereastra [02:00, 05:00] nu
    # coliziona cu niciun alt workflow programat: `identity_drift_check.yml`
    # (06:30 UTC, marja creste de la 30 la 90 min), `check_data_health.yml`
    # (07:30 UTC), `sync_pre_match_odds.yml` (08:00/20:00 UTC), `live_sync.yml`
    # si `consensus_validation.yml` (09:00 UTC), `validation_analysis.yml`
    # (10:00 UTC) - toate raman in afara ferestrei, cu marja mai mare ca
    # inainte, nu mai mica. Comentariile din acele fisiere care citeaza
    # "night_sync.yml (03:00 UTC)" pentru propriul lor calcul de coliziune NU
    # au fost actualizate in acest commit (schimbare cosmetica in alte
    # fisiere, in afara cererii explicite) - raman corecte ca marja (devenita
    # mai larga), doar cifra sursa e invechita. `live_sync.yml` ruleaza la
    # 09:00/13:00/17:00 UTC (verificat direct in live_sync.yml).
    #
    # Singura coliziune preexistenta gasita, NEATINSA de aceasta schimbare
    # (nu mai buna, nu mai rea): `weekly.yml`, duminica 04:00 UTC, cade in
    # continuare in fereastra [02:00, 05:00] a lui night_sync - exista si
    # inainte de schimbarea de azi (fereastra veche [03:00, 06:00] includea
    # deja 04:00). Semnalat proprietarului produsului, nu reparat aici -
    # afara scopul cererii curente.
    #
    # [MODIFICAT — 2026-08-23] timeout-minutes 120 -> 180. Verificat direct
    # (nu presupus): 3 din ultimele 5 rulari (2026-08-20, 2026-08-21,
    # 2026-08-23) au fost anulate de timeout-ul de 120 min, prinse la
    # mijlocul etapei de shadow logging pentru Challenger (ADR-056) -- deci
    # etapa 8 "ML Refresh" (Continuous Learning, ADR-030) nu mai apuca
    # niciodata sa ruleze, blocand evaluarea Challenger-ului activ
    # (xgboost_v1/all) la acelasi numar de meciuri de doua nopti la rand.
    # Cauza exacta a duratei (volum de evaluare shadow vs. alt blocaj) NU
    # a fost investigata separat -- interventie minima, reversibila, ca sa
    # lase pipeline-ul sa se termine; investigatia ramane pas ulterior.
    - cron: "0 2 * * *"
  workflow_dispatch: {}

jobs:
  night-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run Night Sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RAPIDAPI_KEY_FREELIVEFOOTBALL: ${{ secrets.RAPIDAPI_KEY_FREELIVEFOOTBALL }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        # [FIX 2026-08-27] `tee` — pasul "Upload sync logs" de mai jos incarca
        # `logs/` de la crearea lui (commit 3532e6b), dar NIMIC nu scria acolo:
        # tot logging-ul mergea in `StreamHandler(sys.stdout)`, iar `logs/` nu
        # exista. `if-no-files-found: ignore` facea esecul complet tacut.
        #
        # COSTUL, masurat de doua ori pe 2026-08-27: API-ul de log-uri GitHub
        # intoarce doar ultimele ~5.000 de linii, iar aceasta rulare produce
        # peste 100.000. Raportul cu `step_durations_s` era la ~06:45, fereastra
        # citibila incepea la 07:28 — masuratoarea exista si era inaccesibila.
        # Un artefact contine log-ul COMPLET, indiferent de lungime.
        #
        # DE CE `tee` SI NU UN FileHandler in Python: rapoartele se emit prin
        # `print()`, nu prin `logger` (verificat: `run_night.run()`,
        # `run_daily.run()`). Un FileHandler ar captura logging-ul si ar rata
        # exact rapoartele — adica fix ce ne-a lipsit. `tee` prinde stdout +
        # stderr, deci si print, si logging, fara nicio schimbare de cod Python.
        #
        # `set -o pipefail` NU e optional: shell-ul implicit GitHub e `bash -e`,
        # FARA pipefail (verificat: niciun workflow din repo nu declara `shell:`).
        # Fara el, `tee` intoarce 0 si masheaza codul de iesire al scriptului —
        # o rulare ESUATA ar fi raportata ca succes. Adica exact opusul scopului:
        # am transforma o imbunatatire de observabilitate intr-o pierdere de semnal.
        run: |
          mkdir -p logs
          set -o pipefail
          python -m sync.run_night 2>&1 | tee "logs/night_sync_$(date -u +%Y%m%dT%H%M%SZ).log"

      - name: Upload sync logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: night-sync-logs-${{ github.run_id }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Foundation Data Layer backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flashscore-backup-${{ github.run_id }}
          path: backups/
          retention-days: 30
          if-no-files-found: ignore
