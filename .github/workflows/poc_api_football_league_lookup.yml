name: Football Oracle — Probă API-Football League Lookup

on:
  workflow_dispatch:
    inputs:
      country:
        description: "Țară de căutat (ex: Romania) — pentru verificarea league_id real"
        required: true
        default: "Romania"
        type: string

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run API-Football /leagues lookup (discovery, nu integrare)
        run: |
          python sync/poc_api_football_league_lookup.py --country "${{ github.event.inputs.country }}"
