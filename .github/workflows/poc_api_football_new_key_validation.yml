name: Football Oracle — Probă cheie NOUĂ API-Football (izolat)

# POC izolat, temporar — Regula 1 din CLAUDE.md ("Regulile pentru chei API
# și provideri externi"). Contul API-Football activ e SUSPENDAT; utilizatorul
# a furnizat o cheie nouă, de pe alt cont (secret separat, API_FOOTBALL_
# KEY_NEW, NU suprascrie API_FOOTBALL_KEY). Nu importă key_manager.py, nu
# atinge cheia veche, nu e apelat de niciun cod de producție.

on:
  workflow_dispatch: {}

jobs:
  validate-new-key:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests

      - name: Run new-key validation (discovery, nu integrare)
        env:
          API_FOOTBALL_KEY_NEW: ${{ secrets.API_FOOTBALL_KEY_NEW }}
        run: |
          python sync/poc_api_football_new_key_validation.py
