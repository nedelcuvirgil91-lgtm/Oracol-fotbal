name: Football Oracle — Probă API-Football Statistics

on:
  workflow_dispatch:
    inputs:
      league:
        description: "Ligă de verificat (selecție manuală — optimizare de quota)"
        required: true
        default: "Premier League"
        type: choice
        options:
          - "Premier League"
          - "La Liga"
          - "Serie A"
          - "Bundesliga"
          - "Ligue 1"
          - "Romania SuperLiga"
          - "MLS"
      lookup_country:
        description: "OPȚIONAL — dacă completat, rulează DOAR sondajul /leagues pentru această țară (căutare league_id real), sare peste proba de statistici de mai sus"
        required: false
        default: ""
        type: string
      verify_fixtures_league:
        description: "OPȚIONAL — dacă completat, rulează DOAR verificarea end-to-end a fallback-ului de fixtures (get_matches_for_week) pentru această ligă"
        required: false
        default: ""
        type: string
      season_restriction_league_id:
        description: "OPȚIONAL — dacă completat, testează next=/date=/live= pentru acest league_id (ocolesc restricția de sezon?)"
        required: false
        default: ""
        type: string
      freelf_romania_dates:
        description: "OPȚIONAL — date separate prin spațiu (YYYY-MM-DD), verifică dacă Free Live Football are meciuri Romania SuperLiga în acele zile"
        required: false
        default: ""
        type: string
      run_sportapi_check:
        description: "OPȚIONAL — dacă true, rulează verificarea practică SportAPI (sportapi7) — 5 apeluri reale, cotă 50/lună"
        required: false
        default: "false"
        type: boolean
      run_sportapi_deep_check:
        description: "OPȚIONAL — dacă true, rulează sondajul de adâncime SportAPI (statistics/incidents/lineups/h2h/managers/squad/injuries/odds) — 9 apeluri reale"
        required: false
        default: "false"
        type: boolean
      run_sportapi_season_call_check:
        description: "OPȚIONAL — dacă true, testează dacă unique-tournament/.../eventsbyuniquetournamentanddate fără date întoarce tot sezonul — 2 apeluri reale"
        required: false
        default: "false"
        type: boolean
      debug_romania_superliga:
        description: "OPȚIONAL — dacă true, rulează diagnosticul complet pentru bug-ul raportat 'Romania SuperLiga 0 meciuri' (toate etapele pipeline-ului, apeluri reale)"
        required: false
        default: "false"
        type: boolean
      tsdb_romania_lookup:
        description: "OPȚIONAL — dacă true, caută ID-ul real TheSportsDB pentru Romania SuperLiga (lookup 4652 + search Romania + eventsnextleague per candidat)"
        required: false
        default: "false"
        type: boolean
      app_runtime_trace:
        description: "OPȚIONAL — dacă true, reproduce LITERAL fluxul din app.py (nav='matches') cu date reale, pentru comparație directă cu UI-ul live"
        required: false
        default: "false"
        type: boolean
      petrolul_dinamo_investigation:
        description: "OPȚIONAL — dacă true, investighează exclusiv de ce Petrolul-Dinamo (19.07) nu ajunge în all_matches, provider cu provider"
        required: false
        default: "false"
        type: boolean
      tsdb_season_round_ratelimit_check:
        description: "OPȚIONAL — dacă true, testează eventsseason.php/eventsround.php/lookup_all_teams.php + rate limit real TheSportsDB pentru SuperLiga"
        required: false
        default: "false"
        type: boolean
      remaining_teams_check:
        description: "OPȚIONAL — dacă true, verifică ultimele 4 echipe (Corvinul, Csikszereda, Rapid, Sepsi) prin searchteams.php + eventsnext.php"
        required: false
        default: "false"
        type: boolean
      odds_api_romania_viability:
        description: "OPȚIONAL — dacă true, verifică dacă Odds API poate fi sursă principală pentru Romania SuperLiga (meciuri + cote)"
        required: false
        default: "false"
        type: boolean
      espn_full_round_check:
        description: "OPȚIONAL — dacă true, verifică completitudinea ESPN (rou.1) pe toate cele 4 zile ale Etapei 1 SuperLiga"
        required: false
        default: "false"
        type: boolean
      tsdb_reconciliation_live_verify:
        description: "OPȚIONAL — dacă true, verifică live reconcilierea TSDB (post-fix) pentru Romania SuperLiga fata de calendarul oficial Etapa 1"
        required: false
        default: "false"
        type: boolean

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run API-Football /leagues lookup (discovery, league_id real)
        if: github.event.inputs.lookup_country != ''
        run: |
          python sync/poc_api_football_league_lookup.py --country "${{ github.event.inputs.lookup_country }}"

      - name: Run end-to-end fixtures fallback check (get_matches_for_week)
        if: github.event.inputs.verify_fixtures_league != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python sync/poc_api_football_fixtures_check.py --league "${{ github.event.inputs.verify_fixtures_league }}"

      - name: Run season restriction check (next=/date=/live=)
        if: github.event.inputs.season_restriction_league_id != ''
        run: |
          python sync/poc_api_football_season_restriction_check.py --league-id "${{ github.event.inputs.season_restriction_league_id }}"

      - name: Run FreeLF Romania SuperLiga check (discovery, nu integrare)
        if: github.event.inputs.freelf_romania_dates != ''
        run: |
          python sync/poc_freelf_romania_check.py --dates ${{ github.event.inputs.freelf_romania_dates }}

      - name: Run SportAPI (sportapi7) live check (discovery, nu integrare)
        if: github.event.inputs.run_sportapi_check == 'true'
        run: |
          python sync/poc_sportapi_check.py

      - name: Run SportAPI (sportapi7) deep check (discovery, nu integrare)
        if: github.event.inputs.run_sportapi_deep_check == 'true'
        run: |
          python sync/poc_sportapi_deep_check.py

      - name: Run SportAPI season-call check (discovery, nu integrare)
        if: github.event.inputs.run_sportapi_season_call_check == 'true'
        run: |
          python sync/poc_sportapi_season_call_check.py

      - name: Run Romania SuperLiga zero-matches debug (discovery, nu integrare)
        if: github.event.inputs.debug_romania_superliga == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python sync/poc_romania_superliga_debug.py

      - name: Run TheSportsDB Romania league lookup (discovery, nu integrare)
        if: github.event.inputs.tsdb_romania_lookup == 'true'
        run: |
          python sync/poc_tsdb_romania_league_lookup.py

      - name: Run app.py runtime trace (discovery, nu integrare)
        if: github.event.inputs.app_runtime_trace == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python sync/poc_app_runtime_trace.py

      - name: Run Petrolul-Dinamo investigation (discovery, nu integrare)
        if: github.event.inputs.petrolul_dinamo_investigation == 'true'
        run: |
          python sync/poc_petrolul_dinamo_investigation.py

      - name: Run TSDB eventsseason/eventsround/lookup_all_teams/rate-limit check (discovery, nu integrare)
        if: github.event.inputs.tsdb_season_round_ratelimit_check == 'true'
        run: |
          python sync/poc_tsdb_season_round_ratelimit_check.py

      - name: Run remaining teams check (discovery, nu integrare)
        if: github.event.inputs.remaining_teams_check == 'true'
        run: |
          python sync/poc_remaining_teams_check.py

      - name: Run Odds API Romania viability check (discovery, nu integrare)
        if: github.event.inputs.odds_api_romania_viability == 'true'
        run: |
          python sync/poc_odds_api_romania_viability.py

      - name: Run ESPN full round completeness check (discovery, nu integrare)
        if: github.event.inputs.espn_full_round_check == 'true'
        run: |
          python sync/poc_espn_full_round_check.py

      - name: Run TSDB reconciliation live verify (discovery, nu integrare)
        if: github.event.inputs.tsdb_reconciliation_live_verify == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python sync/poc_tsdb_reconciliation_live_verify.py

      - name: Run API-Football statistics probe (discovery, nu integrare)
        if: github.event.inputs.lookup_country == '' && github.event.inputs.verify_fixtures_league == '' && github.event.inputs.season_restriction_league_id == '' && github.event.inputs.freelf_romania_dates == '' && github.event.inputs.run_sportapi_check == 'false' && github.event.inputs.run_sportapi_deep_check == 'false' && github.event.inputs.run_sportapi_season_call_check == 'false' && github.event.inputs.debug_romania_superliga == 'false' && github.event.inputs.tsdb_romania_lookup == 'false' && github.event.inputs.app_runtime_trace == 'false' && github.event.inputs.petrolul_dinamo_investigation == 'false' && github.event.inputs.tsdb_season_round_ratelimit_check == 'false' && github.event.inputs.remaining_teams_check == 'false' && github.event.inputs.odds_api_romania_viability == 'false' && github.event.inputs.espn_full_round_check == 'false' && github.event.inputs.tsdb_reconciliation_live_verify == 'false'
        env:
          # Necesar pentru ca cache-ul (team_id/fixture_id/verdict 403-404)
          # să supraviețuiască între rulări separate ale acestui workflow —
          # fiecare rulare e un runner efemer, fără disc local persistent.
          # Fără Supabase, optimizarea de quota funcționează doar în cadrul
          # aceleiași rulări, nu între rulări.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python sync/poc_api_football_statistics.py --league "${{ github.event.inputs.league }}"
