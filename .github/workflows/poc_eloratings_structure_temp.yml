name: POC izolat — structură eloratings.net (temporar)

# [ADAUGAT — 2026-08-10] Investighează de ce sincronizarea ELO echipe
# naționale (R-Sync-4) persistă de săptămâni doar lista statică de
# fallback, nu date live — vezi scripts/_poc_eloratings_structure_temp.py
# pentru contextul complet. Nu importă key_manager.py/oracle_api.py, nu
# scrie nicăieri, nu atinge niciun workflow existent. Se șterge după
# închiderea investigației.

on:
  workflow_dispatch: {}

jobs:
  poc-eloratings-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Playwright
        run: pip install playwright

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run structure POC
        run: python scripts/_poc_eloratings_structure_temp.py
