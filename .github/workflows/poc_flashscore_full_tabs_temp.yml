name: POC izolat — Flashscore toate tab-urile (1 meci, temporar)

on:
  push:
    branches: [claude/sprint0-stabilizare-feedback-loop]
    paths:
      - ".github/workflows/poc_flashscore_full_tabs_temp.yml"
      - "scripts/_poc_flashscore_full_tabs_temp.py"

permissions:
  contents: write

jobs:
  poc-flashscore-full-tabs:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run Flashscore full-tabs POC (1 match, standard Playwright, no evasion)
        run: python scripts/_poc_flashscore_full_tabs_temp.py || true

      - name: Commit evidence (log download blocked in dev env, tipar stabilit)
        if: always()
        run: |
          if [ -d docs/06_UDAL/poc_evidence/flashscore_full_tabs_poc ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/06_UDAL/poc_evidence/flashscore_full_tabs_poc
            git commit -m "POC temp: Flashscore full-tabs evidence (1 meci)" || echo "nimic de comis"
            git push
          else
            echo "Niciun folder de evidenta creat - scriptul a esuat inainte de a scrie."
          fi
