name: UDAL — POC Flashscore Missing Players (temporar)

# [ADAUGAT 2026-08-30] POC izolat, temporar — verifica DACA Flashscore
# randeaza, pentru meciurile urmarite, un widget real de "jucatori absenti"
# (accidentati/suspendati) cu nume reale, sau daca string-urile
# TRANS_MISSING_PLAYERS gasite anterior in bundle-ul JS sunt doar
# infrastructura de traducere, fara continut real (verificat deja ca
# apar identic pe orice pagina, indiferent de continut - fals pozitiv
# posibil, netestat inca live).
#
# Flashscore NU e o sursa noua (deja scrapuita in productie,
# providers/flashscore/, fara blocaj anti-bot documentat) - regula
# POC-urilor izolate pentru surse noi (ocolire anti-bot interzisa) nu se
# aplica identic aici (nu exista nicio protectie de ocolit), dar POC-ul
# ramane izolat: Playwright STANDARD, fara import de cod de productie
# UDAL, fara scraper_registry/tos_reviewed, ZERO scriere in Supabase.
#
# Rulare STRICT manuala. Sters dupa inchiderea investigatiei (tiparul
# deja stabilit pentru POC-uri izolate).

on:
  workflow_dispatch: {}

jobs:
  poc-flashscore-missing-players:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install playwright

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run POC (read-only, zero scriere Supabase)
        run: python scripts/_poc_flashscore_missing_players_temp.py

      - name: Upload evidence as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-flashscore-missing-players-${{ github.run_id }}
          path: docs/06_UDAL/poc_evidence/flashscore_missing_players/
          retention-days: 14
          if-no-files-found: warn
