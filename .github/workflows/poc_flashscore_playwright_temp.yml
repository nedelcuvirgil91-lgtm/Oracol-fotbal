name: POC izolat — Flashscore Playwright live check (temporar)

on:
  push:
    branches: [claude/sprint0-stabilizare-feedback-loop]
    paths:
      - ".github/workflows/poc_flashscore_playwright_temp.yml"
      - "scripts/_poc_flashscore_playwright_temp.py"

permissions:
  contents: write

jobs:
  poc-flashscore-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run Flashscore live POC (single page, headless, no evasion)
        run: python scripts/_poc_flashscore_playwright_temp.py || true

      - name: Commit evidence (log download blocked in dev env, tipar stabilit)
        if: always()
        run: |
          if [ -d docs/06_UDAL/poc_evidence ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/06_UDAL/poc_evidence
            git commit -m "POC temp: Flashscore Playwright live check evidence" || echo "nimic de comis"
            git push
          else
            echo "Niciun folder de evidenta creat - scriptul a esuat inainte de a scrie."
          fi
