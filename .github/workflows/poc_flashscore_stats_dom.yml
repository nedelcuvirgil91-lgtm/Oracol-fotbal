name: POC — de ce s-a oprit extragerea statisticilor Flashscore (TEMPORAR)

# TEMPORAR. Se șterge odată cu `_poc_flashscore_stats_dom_temp.py`, după
# închiderea investigației; dovada rămâne în istoricul rulărilor.
#
# DE CE EXISTĂ: `match_statistics_extended`, `player_match_stats` și
# `player_match_stats_extended` n-au mai primit NICIUN rând după 2026-09-08 —
# 39 de zile — în timp ce `flashscore_match_context` și `match_events` scriu
# normal. Sesiunea de dezvoltare nu poate atinge flashscore.com (politica de
# rețea întoarce 403 la proxy), deci comparația de structură se face aici.
#
# ZERO SECRETE, DELIBERAT. Jobul NU primește SUPABASE_URL/SUPABASE_SECRET_KEY,
# deci chiar dacă scriptul ar încerca o scriere, n-ar avea unde. Impus și de
# garda `tests/test_poc_isolation.py`, nu doar promis aici.
#
# Doar `workflow_dispatch` — nu intră în niciun program automat.

on:
  workflow_dispatch: {}

jobs:
  poc:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install minimal dependencies
        run: pip install playwright beautifulsoup4

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run POC (read-only, fără credențiale de bază de date)
        run: python _poc_flashscore_stats_dom_temp.py
