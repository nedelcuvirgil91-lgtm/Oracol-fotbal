name: POC izolat — UDAL POC_SCRAPER_SOURCE_01 (WorldFootball + SofaScore, temporar)

on:
  push:
    branches: [claude/sprint0-stabilizare-feedback-loop]
    paths:
      - ".github/workflows/poc_scraper_source_01_temp.yml"
      - "scripts/_poc_scraper_source_01_temp.py"

permissions:
  contents: write

jobs:
  poc-scraper-source-01:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run POC_SCRAPER_SOURCE_01 (WorldFootball + SofaScore)
        run: python scripts/_poc_scraper_source_01_temp.py || true

      - name: Commit evidence (log download blocked in dev env, tipar stabilit)
        if: always()
        run: |
          if [ -d docs/06_UDAL/poc_evidence ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/06_UDAL/poc_evidence
            git commit -m "POC_SCRAPER_SOURCE_01: evidenta live (WorldFootball + SofaScore)" || echo "nimic de comis"
            git push
          else
            echo "Niciun folder de evidenta creat - scriptul a esuat inainte de a scrie."
          fi
