name: UDAL — POC SofaScore News Pages (temporar)

# [ADAUGAT 2026-08-30] POC izolat, temporar — verifica DACA paginile
# editoriale www.sofascore.com/news/... (previzualizari de meci cu
# accidentari, publicate cu zile inainte de fluier) sunt accesibile fara
# protectia Akamai care blocheaza api.sofascore.com (confirmat 14/14 HTTP
# 403 in _poc_scraper_source_01_temp.py, cercetare CLAUDE.md 2026-08-30).
#
# NU incearca nicio ocolire anti-bot (fara curl_cffi, fara amprentare TLS
# falsa, fara header-e de browser fals) - un raspuns blocat se raporteaza
# ca atare, nu se ocoleste. Vezi scripts/_poc_sofascore_news_pages_temp.py
# pentru detaliul complet.
#
# Rulare STRICT manuala, niciodata pe schedule - o sursa neaprobata nu se
# acceseaza automat, repetat, fara supraveghere. Sters dupa inchiderea
# investigatiei (tiparul deja stabilit pentru POC-uri izolate).

on:
  workflow_dispatch: {}

jobs:
  poc-sofascore-news-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies (requests only — fara Playwright/curl_cffi)
        run: pip install requests beautifulsoup4

      - name: Run POC (read-only, zero scriere Supabase)
        run: python scripts/_poc_sofascore_news_pages_temp.py

      # [CORECTAT 2026-08-30] Varianta initiala incerca `git push` cu
      # token-ul implicit, fara niciun precedent verificat ca ar functiona
      # in acest repo — dovada POC-ului anterior (SofaScore API) fusese
      # comisa manual de o sesiune Claude, nu de workflow. Artefact, nu
      # push — tipar deja dovedit (night_sync.yml, live_sync.yml).
      - name: Upload evidence as artifact (citita manual, comisa separat daca merita)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-sofascore-news-pages-${{ github.run_id }}
          path: docs/06_UDAL/poc_evidence/
          retention-days: 14
          if-no-files-found: warn
