name: Football Oracle — Sprint 0 Stats API PoC

on:
  workflow_dispatch:
    inputs:
      quick:
        description: "Quick mode (5 meciuri/ligă în loc de 18)"
        required: false
        default: "true"
        type: boolean

jobs:
  poc:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests

      - name: Run Stats API PoC
        env:
          STATS_API_KEY: ${{ secrets.STATS_API_KEY }}
        run: |
          ARGS="--quick"
          if [ "${{ github.event.inputs.quick }}" = "false" ]; then
            ARGS=""
          fi
          python sync/poc_statsapi.py $ARGS
