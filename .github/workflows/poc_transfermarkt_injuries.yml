name: UDAL — POC Transfermarkt Injuries (temporar)

# [ADAUGAT 2026-08-30] POC izolat, temporar — verifica DACA Transfermarkt
# e o sursa viabila de accidentari/suspendari, CU valoare de piata (campul
# care lipsea la Flashscore, investigatie inchisa aceeasi zi — vezi
# CLAUDE.md, gol aliniamente).
#
# Semnal de pornire: proiecte open-source publice extrag date Transfermarkt
# cu `requests` simplu, fara stealth/proxy — sugereaza protectie usoara,
# spre deosebire de SofaScore (Akamai, respins 2026-08-30). NU se importa
# acel cod, doar tiparul de URL confirmat structural.
#
# NU incearca nicio ocolire anti-bot (fara header-e de browser fals — desi
# proiectul de referinta foloseste unul, aici NU se copiaza, deliberat) -
# un raspuns blocat se raporteaza ca atare. Descoperire, nu presupunere:
# cluburile de testat vin din pagina reala Premier League, nu ID-uri
# ghicite. Vezi scripts/_poc_transfermarkt_injuries_temp.py.
#
# Rulare STRICT manuala. Sters dupa inchiderea investigatiei (tiparul deja
# stabilit pentru POC-uri izolate).

on:
  workflow_dispatch: {}

jobs:
  poc-transfermarkt-injuries:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies (requests only)
        run: pip install requests

      - name: Run POC (read-only, zero scriere Supabase)
        run: python scripts/_poc_transfermarkt_injuries_temp.py

      - name: Upload evidence as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-transfermarkt-injuries-${{ github.run_id }}
          path: docs/06_UDAL/poc_evidence/transfermarkt_injuries/
          retention-days: 14
          if-no-files-found: warn
