name: "POC temporar — istoric accidentari Transfermarkt (read-only)"

# POC TEMPORAR. SE ȘTERGE, împreună cu scriptul, după închiderea investigației.
# Dovada rămâne în istoricul rulărilor GitHub Actions, nu ca infrastructură vie
# (regula din CLAUDE.md §chei API, aplicată deja de 4 ori).
#
# ÎNTREBAREA, UNA SINGURĂ: Transfermarkt publică istoric de accidentări per
# jucător, cu intervale de date, parsabil? Fără el, un backtest al penalizării
# de accidentări pe meciuri deja jucate (Calea 2) e imposibil, iar rămâne doar
# Calea 1 (shadow, ~6-8 săptămâni).
#
# DE CE ERA NEVOIE DE EL: Calea 0 (sensibilitate + plafon) s-a dovedit incapabilă
# să mărginească proiectul — plafonul măsura capacitatea de supraînvățare a unei
# alegeri 4-ale cu hindsight, nu valoarea informației despre absențe. Oracolul
# nul a arătat-o: pe rezultate permutate câștigă la fel sau mai mult. Deci
# întrebarea „cât valorează informația despre absențe" nu se poate răspunde
# fără informație despre absențe.
#
# READ-ONLY PRIN CONSTRUCȚIE, NU PRIN PROMISIUNE
#   - scriptul NU importă `database/queries.py`, `supabase_client.py` sau
#     `freelf_lineup_adapter.py` — nu are funcția prin care s-ar putea scrie;
#   - acest workflow NU îi dă `SUPABASE_SECRET_KEY` sau `SUPABASE_URL`, deci
#     orice scriere ar eșua oricum;
#   - verificat în cod: există EXACT o cale prin care date de accidentări ating
#     o predicție — `freelf_lineup_snapshot` -> `get_freelf_lineup_snapshot()`
#     (`oracle_engine.py:1810`) -> `apply_injury_penalty()` -> xG -> Poisson.
#     `team_health_snapshot` NU atinge predicția (`oracle_engine.py:1852`).
#
# NICIO OCOLIRE ANTI-BOT: Playwright headless standard, fără stealth, proxy sau
# fingerprint spoofing — identic cu `providers/flashscore/adapter.py:181`, deja
# în producție. La captcha interactiv, POC-ul se oprește și o raportează.

on:
  workflow_dispatch:

concurrency:
  group: poc-transfermarkt-injury-history
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poc:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      # DELIBERAT fără `env:` — niciun secret Supabase. O scriere ar eșua
      # chiar dacă scriptul ar încerca, iar el oricum nu importă modulele care
      # pot scrie.
      - name: Run POC
        run: |
          set -o pipefail
          mkdir -p logs
          python _poc_transfermarkt_injury_history_temp.py \
            2>&1 | tee "logs/poc_transfermarkt_injury_history_$(date -u +%Y%m%dT%H%M%SZ).log"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-transfermarkt-injury-history-${{ github.run_id }}
          path: logs/
          if-no-files-found: error
          retention-days: 30
