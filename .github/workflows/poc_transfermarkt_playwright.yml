name: UDAL — POC Transfermarkt Playwright (temporar)

# [ADAUGAT 2026-08-31] Continuare a POC_TRANSFERMARKT_INJURIES — cererile
# HTTP oneste (requests) au primit uniform x-amzn-waf-action: challenge
# (AWS WAF) pe toate cele 6 variante testate (domeniu, header-e, User-
# Agent). Acest POC testeaza daca Playwright STANDARD (identic tiparului
# de productie Flashscore — headless, fara stealth/proxy/fingerprint
# spoofing) trece de provocare prin simpla randare normala a paginii.
#
# REGULA CRITICA: daca provocarea se dovedeste un CAPTCHA INTERACTIV,
# scriptul se opreste IMEDIAT, fara nicio interactiune — vezi
# scripts/_poc_transfermarkt_playwright_temp.py, InteractiveCaptchaDetected.
#
# Rulare STRICT manuala. Sters dupa inchiderea investigatiei.

on:
  workflow_dispatch: {}

jobs:
  poc-transfermarkt-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install playwright

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run POC (read-only, zero scriere Supabase)
        run: python scripts/_poc_transfermarkt_playwright_temp.py

      - name: Upload evidence as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-transfermarkt-playwright-${{ github.run_id }}
          path: docs/06_UDAL/poc_evidence/transfermarkt_playwright/
          retention-days: 14
          if-no-files-found: warn
