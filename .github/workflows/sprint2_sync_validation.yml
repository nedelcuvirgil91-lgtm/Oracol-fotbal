name: Football Oracle — Sprint 2 Sync Validation (temporar)

# [ADAUGAT Sprint 2] Unealtă de validare pentru activarea celor 6 sync-uri
# orfane (Etapa C, Data Quality) — confirmă end-to-end (rețea reală, scriere
# reală în Supabase) înainte ca pasul respectiv să intre permanent în
# run_daily.py/weekly.yml. Se șterge după ce toate cele 6 sunt validate.
#
# Trigger pe `push`, nu `workflow_dispatch` — API-ul de dispatch cere ca
# fișierul de workflow să existe deja pe branch-ul implicit (main), ceea ce
# nu e cazul aici (branch de lucru, nemerge-uit încă). Modulul de rulat e
# hardcodat mai jos (SYNC_MODULE) — se editează și se re-push-uiește pentru
# fiecare din cele 6 validări, tiparul deja folosit la POC-urile anterioare
# din acest proiect.

on:
  push:
    branches:
      - claude/etapa-c-sprint2-data-quality
    paths:
      - .github/workflows/sprint2_sync_validation.yml

jobs:
  validate-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYNC_MODULE: sync_weather_forecast

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync module
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RAPIDAPI_KEY_FREELIVEFOOTBALL: ${{ secrets.RAPIDAPI_KEY_FREELIVEFOOTBALL }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m sync.$SYNC_MODULE
