name: Football Oracle — Sprint 3 R-Sync-7b Shadow Trigger (temporar)

# Declanseaza get_matches_for_week() real (acelasi apel ca app.py), acum
# ca scheduled_fixtures_shadow_enabled=true - produce prima evaluare
# reala in equivalence_evaluations (R-Sync-7b). Se sterge dupa confirmare.

on:
  push:
    branches:
      - claude/sprint0-stabilizare-feedback-loop
    paths:
      - .github/workflows/sprint3_rsync7b_trigger.yml

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Trigger get_matches_for_week (real, produces shadow evaluation)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RAPIDAPI_KEY_FREELIVEFOOTBALL: ${{ secrets.RAPIDAPI_KEY_FREELIVEFOOTBALL }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: python -m sync.poc_trigger_scheduled_fixtures_shadow
