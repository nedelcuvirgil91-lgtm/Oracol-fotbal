name: Football Oracle — Sprint 3 Scheduled Fixtures First Run (temporar)

# Prima rulare reala a sync/sync_scheduled_fixtures.py, acum ca e conectata
# in run_daily.py (Sprint 3, Prioritatea 2). Populeaza scheduled_fixtures
# pentru prima data - tabela era 0 randuri, confirmat live. Se sterge dupa
# ce rezultatul e confirmat (dovada ramane in istoricul rularii + raportul
# SQL de coverage).

on:
  push:
    branches:
      - claude/sprint0-stabilizare-feedback-loop
    paths:
      - .github/workflows/sprint3_scheduled_fixtures_run.yml

jobs:
  run-scheduled-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync_scheduled_fixtures (days-ahead 7)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RAPIDAPI_KEY_FREELIVEFOOTBALL: ${{ secrets.RAPIDAPI_KEY_FREELIVEFOOTBALL }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: python -m sync.sync_scheduled_fixtures --days-ahead 7
