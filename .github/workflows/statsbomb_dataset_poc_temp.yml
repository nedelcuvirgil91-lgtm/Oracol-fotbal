name: POC izolat — inspectare dataset Kaggle StatsBomb (temporar)

on:
  push:
    branches: [claude/sprint0-stabilizare-feedback-loop]
    paths:
      - ".github/workflows/statsbomb_dataset_poc_temp.yml"
      - "scripts/_statsbomb_dataset_poc_temp.py"

permissions:
  contents: write

jobs:
  statsbomb-inspect-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Inspect StatsBomb Kaggle dataset
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
        run: |
          python scripts/_statsbomb_dataset_poc_temp.py || true

      - name: Commit POC output (evidence, log download blocked in dev env)
        if: always()
        run: |
          if [ -f scripts/_statsbomb_poc_output_temp.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add scripts/_statsbomb_poc_output_temp.txt
            git commit -m "POC temp: statsbomb dataset inspection output" || echo "nimic de comis"
            git push
          else
            echo "Fisierul de output nu a fost creat - scriptul a esuat inainte de a scrie."
          fi
