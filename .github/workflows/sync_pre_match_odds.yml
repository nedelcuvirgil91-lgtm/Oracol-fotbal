name: Football Oracle — Sync Pre-Match Odds (Flashscore)

# [ACTIVAT — Faza finalizare ADR-043, 2026-08-04] Flux SEPARAT, izolat
# deliberat de night_sync.yml/live_sync.yml — nu procesează meciuri
# finalizate (semantică diferită: acelea sunt "ce s-a jucat", acesta e
# "ce urmează să se joace, cu ce cote"). Scrie DOAR în
# `odds_fallback_flashscore` (ADR-043) — niciodată `odds_history`
# (Frozen). Vezi docstring modul `providers/flashscore/pre_match_odds.py`
# pentru justificarea completă a separării.
#
# Cadență: [REDUS — 2026-08-10, cerere explicită proprietar produs, buget
# GitHub Actions 90% consumat (1800/2000 min) după doar 10 zile din ciclul
# de facturare] de la 2x/zi la 1x/3 zile (08:00 UTC, zi din 3). Spre
# deosebire de live_sync.yml, acest job NU are Delta Sync — rescanează
# integral fereastra de 7 zile la fiecare rulare, deci costul e strict
# proporțional cu frecvența (~50min/zi -> ~8.3min/zi, ~1500->~250 min/lună,
# cea mai mare economie dintre toate reducerile de cadență de azi). Impact
# pe calitatea predicțiilor: ZERO — cotele nu sunt feature ML (verificat,
# FEATURE_COLUMNS din ml_predictor.py), intră doar în value betting/de-vig.
# Impact real, limitat: `odds_fallback_flashscore` servește DOAR meciurile
# fără nicio cotă de la Odds API (verificat live, 498 rânduri, 04-09 aug)
# — pentru acelea, cota poate fi cu până la 3 zile mai veche decât piața
# reală, risc de flag de value bet depășit, mai ales aproape de kickoff.
#
# Declanșare programată (schedule) vs. manuală (workflow_dispatch) diferă
# în domeniul de acoperire, intenționat: rularea programată acoperă
# TOATE ligile din FLASHSCORE_TRACKED_COMPETITIONS, fără plafon
# (producție reală) — `github.event.inputs` nu există la evenimente
# `schedule`, deci pasul de mai jos omite complet flag-urile
# `--leagues`/`--limit-per-league` în acel caz (CLI: fără ele =
# acoperire completă). Rularea manuală păstrează implicit valorile mici
# de verificare (o singură ligă, plafon 3) — pot fi schimbate din UI
# pentru un test mai larg, fără să afecteze rularea automată.

on:
  schedule:
    - cron: "0 8 */3 * *"
  workflow_dispatch:
    inputs:
      leagues:
        description: "Ligi separate prin virgulă (gol = toate din FLASHSCORE_TRACKED_COMPETITIONS)"
        required: false
        default: "Europa League"
      days_ahead:
        description: "Fereastră (zile) pentru meciuri viitoare"
        required: false
        default: "7"
      limit_per_league:
        description: "Plafon meciuri per ligă (gol = fără plafon)"
        required: false
        default: "3"

concurrency:
  group: sync-pre-match-odds
  cancel-in-progress: false

jobs:
  sync-pre-match-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run Pre-Match Odds Sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RAPIDAPI_KEY_FREELIVEFOOTBALL: ${{ secrets.RAPIDAPI_KEY_FREELIVEFOOTBALL }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          ARGS=(--days-ahead "${{ github.event.inputs.days_ahead || '7' }}")
          if [ -n "${{ github.event.inputs.leagues }}" ]; then
            ARGS+=(--leagues "${{ github.event.inputs.leagues }}")
          fi
          if [ -n "${{ github.event.inputs.limit_per_league }}" ]; then
            ARGS+=(--limit-per-league "${{ github.event.inputs.limit_per_league }}")
          fi
          python -m sync.sync_pre_match_odds "${ARGS[@]}"

      - name: Upload sync logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-match-odds-logs-${{ github.run_id }}
          path: logs/
          retention-days: 14
          if-no-files-found: ignore
