name: POC izolat — descoperire meciuri UCL (temporar)

on:
  push:
    branches: [claude/sprint0-stabilizare-feedback-loop]
    paths:
      - ".github/workflows/ucl_discovery_poc_temp.yml"
      - "scripts/_ucl_discovery_poc_temp.py"

jobs:
  ucl-discovery-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run UCL discovery POC
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RAPIDAPI_KEY_FREELIVEFOOTBALL: ${{ secrets.RAPIDAPI_KEY_FREELIVEFOOTBALL }}
        run: |
          python scripts/_ucl_discovery_poc_temp.py
