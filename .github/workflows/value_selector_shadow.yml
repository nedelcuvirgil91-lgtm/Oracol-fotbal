name: Football Oracle — Value Selector Shadow (ADR-071 F2)

# Colectare prospectivă pentru experimentul de politică de selecție (ADR-071,
# faza F2). NU schimbă nimic pentru utilizator: nu activează Top Value Bets, nu
# atinge nicio predicție, nicio cotă și niciun rând existent. Rulează cele 13
# profile în paralel pe aceleași intrări și scrie exclusiv în tabela proprie
# `value_selector_shadow`.
#
# Gatat de `value_selector_shadow_logging_enabled` (model_config), implicit
# FALSE (North Star #3). Cât timp flagul e stins, jobul pornește, constată că e
# oprit și iese în câteva secunde — cost aproape zero, dar cadența e deja
# stabilită și verificabilă.
#
# Oră: 09:40 UTC. Aleasă deliberat:
#   - DUPĂ `sync_pre_match_odds` (08:00 UTC, plafon 60 min) — cotele zilei
#     trebuie să fie deja persistate în `odds_history` când citim;
#   - fără coliziune la minut cu `live_sync`/`consensus_validation` (09:00 și
#     09:20 UTC) sau `flashscore_extra_leagues` (10:30 UTC), aceeași disciplină
#     „fără suprapunere prin programare" aplicată în tot proiectul.
#
# Fereastră: `--days-ahead 3` = azi + 3 zile calendaristice (azi..+3), NU azi+2.
# Limita e `moment + timedelta(days=N)`, iar filtrul pe `kickoff_date` e `<=`,
# deci ziua N intră întreagă. Verificat pe rularea 38743747073: a scris 15, 16,
# 17 ȘI 18 octombrie. Ziua a patra e marjă utilă, nu risipă — vezi mai jos de ce.
#
# ÎNTÂRZIEREA REALĂ A SLOTULUI, măsurată pe 6 zile consecutive (9-14 oct): ora
# declarată e 09:40 UTC, ora la care rularea chiar pornește e 14:38-19:16, adică
# o întârziere de 5h-9h36m, în FIECARE zi. Coada GitHub, fenomenul documentat în
# CLAUDE.md din august. Două consecințe:
#   1. Ziua a patra din fereastră acoperă exact această întârziere — ecranul are
#      rânduri pentru cele trei zile afișate chiar și când rularea de azi n-a
#      sosit încă.
#   2. Motivul de programare din antet („DUPĂ sync_pre_match_odds, ca să fie
#      cotele proaspete") e corect ca intenție, dar în practică rularea aterizează
#      după-amiaza, nu la 09:40. NEschimbat deliberat — mutarea orei declarate nu
#      scurtează coada, iar fără măsurători pe mai multe săptămâni n-avem cum ști
#      dacă ar ajuta.
#
# CORECTURĂ (2026-10-15): o versiune anterioară a acestui comentariu spunea că
# slotul de 09:40 din 15 oct „a fost ABANDONAT". Fals — verificarea se făcuse la
# 13:33 UTC, adică înainte de cea mai devreme oră la care rularea a sosit vreodată
# (14:38). Un singur instantaneu citit ca o serie. Lăsat scris aici fiindcă
# afirmația greșită apucase să intre într-un commit.
#
# Mărită de la 1 pe 2026-10-15, când ecranul Top
# Value Bets a trecut pe trei zile: fără ea, zilele +1 și +2 n-ar avea rânduri
# în `value_selector_shadow`, iar ecranul ar cădea pe calculul live — zeci de
# evaluări complete într-o sesiune Streamlit. Costul măsurat înainte: ~1053
# rânduri/zi peste cele 13 profile, ~1,2 MB/zi în tabelă (36.816 rânduri /
# 47 MB la 40 de zile). Tripleaz-o și devine ~3,5 MB/zi, pe o tabelă care NU
# are azi nicio politică de retenție — gol cunoscut, consemnat, nu ascuns.
#
# Întârzierile cozii GitHub (documentate, până la 11-12h în perioade de
# throttling) NU falsifică experimentul: `evaluated_at` e persistat per rând,
# iar prospețimea predicției și `leakage_suspect` se calculează față de el.
# O rulare întârziată se vede în date, nu se ascunde.

on:
  schedule:
    - cron: "40 9 * * *"
  workflow_dispatch:
    inputs:
      days_ahead:
        description: "Câte zile înainte se evaluează (implicit 3 = azi..+3, patru zile)"
        required: false
        default: "3"
      dry_run:
        description: "true = calculează și raportează, fără să scrie nimic"
        required: false
        default: "false"
      force:
        description: >-
          true = ocolește DOAR verificarea flagului, pentru o rulare manuală
          autorizată explicit. NU activează niciun flag, NU atinge configurația,
          NU deblochează UI-ul. Rulările programate nu îl pot folosi:
          github.event.inputs e gol la cron, deci expresia de mai jos produce
          șir vid și argumentul nu ajunge niciodată în linia de comandă.
        required: false
        default: "false"

concurrency:
  group: value-selector-shadow
  cancel-in-progress: false

jobs:
  value-selector-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run value selector shadow collection
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python -m value_selector_shadow \
            --days-ahead "${{ github.event.inputs.days_ahead || '3' }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }}
