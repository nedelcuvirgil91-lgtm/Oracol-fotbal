name: Football Oracle — Verify Dataset Freshness (Kaggle)

on:
  workflow_dispatch:
    inputs:
      reference_date:
        description: "Data de referință (YYYY-MM-DD) față de care se numără rândurile mai noi"
        required: false
        default: "2025-06-01"
        type: string

jobs:
  verify-freshness:
    runs-on: ubuntu-latest
    # Script read-only — nu scrie nimic în Supabase, doar scanează CSV-urile
    # Kaggle (~14 MB total) pentru data minimă/maximă reală. Mult mai rapid
    # decât import-ul complet (fără request-uri HTTP către Supabase).
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run dataset freshness verification
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
        run: |
          echo "Rulează: python -m sync.verify_dataset_freshness --reference-date ${{ github.event.inputs.reference_date }}"
          python -m sync.verify_dataset_freshness --reference-date "${{ github.event.inputs.reference_date }}"
