name: Football Oracle — Weekly National Team ELO Sync

on:
  schedule:
    # Duminică la 04:00 UTC (după sync-ul zilnic de la 03:00)
    - cron: "0 4 * * 0"
  workflow_dispatch:

jobs:
  weekly-elo-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # [ADAUGAT — corectare R-Sync-4, 2026-08-10] eloratings.net randază
      # tabelul de ratinguri 100% client-side (SlickGrid) — necesită
      # Chromium real, nu doar pachetul Python `playwright` (deja în
      # requirements.txt). Vezi elo_ratings_adapter.py pentru context complet.
      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      # [ADAUGAT Sprint 2, Etapa C — Data Quality] Sincronizare ELO echipe
      # naționale (eloratings.net, R-Sync-4) — fără concept de cotă zilnică,
      # frecvență WEEKLY conform planului aprobat (Sprint 2, Pasul 2).
      - name: Sync National Team ELO
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m sync.sync_national_team_elo

      # [ELIMINAT — 2026-08-06, audit infrastructură] Pasul "Retrain ML
      # model" apela MLPredictorEngine().train() direct — a treia copie a
      # aceluiași tipar deja eliminat prin ADR-054 (pipeline legacy din
      # sync/run_daily.py) și ADR-055 (butonul manual din app.py): antrena
      # un model complet, îl arunca imediat (niciun artefact persistat,
      # niciodată Challenger), dar suprascria `ml_model_status` (citită de
      # should_retrain_ml() pentru progress bar-ul din UI) și insera un rând
      # fals în `training_runs`. Nu mai putea contamina Challenger-ul real
      # (continuous_learning.py ancorează azi exclusiv pe get_latest_
      # challenger(), imun) — dar rămânea muncă CI irosită + cifre UI
      # înșelătoare. Antrenarea reală rămâne exclusiv responsabilitatea
      # learning_core/continuous_learning.py (Faza B, ADR-030), rulată
      # nocturn din night_sync.yml.
