[server]
# [ADAUGAT — incident 2026-08-05] Streamlit 1.61.0 (rezolvat implicit din
# requirements.txt, "streamlit>=1.32.0" fără plafon superior) a activat
# noul server experimental bazat pe Starlette (streamlit/streamlit#13600).
# Middleware-ul lui intern (streamlit/web/server/starlette/
# starlette_gzip_middleware.py) e incompatibil cu versiunea de `starlette`
# instalată — TypeError: GZipResponder.__init__() missing 1 required
# keyword-only argument: 'thread_minimum_size' — bug în Streamlit însuși,
# nu în codul acestui repo, dar blochează FIECARE cerere către aplicație
# (crash loop confirmat în logurile Streamlit Cloud). Forțăm explicit
# serverul Tornado (stabil, testat de ani de zile) până când Streamlit
# remediază bug-ul în server-ul experimental într-o versiune nouă.
useStarlette = false
